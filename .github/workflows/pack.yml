name: Check npm Package

# Checks what `npm pack` would publish: every entry point is in the package,
# and no file from the latest published version is gone. Add the
# `pack-files-removed` label to a PR that removes files on purpose.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The pnpm version comes from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile typescript
        run: pnpm --filter @mapbox/mcp-server run build

      - name: Check npm package contents
        env:
          PACK_ALLOW_REMOVED: ${{ contains(github.event.pull_request.labels.*.name, 'pack-files-removed') }}
        run: pnpm --filter @mapbox/mcp-server run check:pack
